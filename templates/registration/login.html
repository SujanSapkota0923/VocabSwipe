{% extends 'base.html' %}
{% block title %}Log in · VocabSwipe{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-10 md:py-16">
    <div class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">Welcome <span
                class="gradient-text">back</span></h1>
        <p class="text-slate-500">Log in to reach your words.</p>
    </div>

    <form method="post" class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-6 md:p-8 border border-slate-100 space-y-5">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="bg-red-50 text-red-600 p-3 rounded-xl text-sm border border-red-100">{{ form.non_field_errors }}</div>
        {% endif %}

        <div>
            <label for="{{ form.username.id_for_label }}" class="block text-sm font-semibold text-slate-600 mb-2">Username</label>
            <input type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username" autofocus required
                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition-all">
        </div>

        <div>
            <label for="{{ form.password.id_for_label }}" class="block text-sm font-semibold text-slate-600 mb-2">Password</label>
            <input type="password" name="password" id="{{ form.password.id_for_label }}" autocomplete="current-password" required
                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition-all">
        </div>

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit"
            class="w-full gradient-bg text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 hover:-translate-y-0.5 active:scale-95 transition-all">Log
            in</button>

        <p class="text-center text-sm text-slate-500">No account?
            <a href="{% url 'signup' %}" class="font-bold text-indigo-600 hover:text-indigo-800">Sign up</a>
        </p>
    </form>
</div>
{% endblock %}
